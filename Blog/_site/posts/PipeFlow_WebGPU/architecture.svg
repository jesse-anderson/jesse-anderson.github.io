<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Data flow. When the network changes: network, global gradient solve on the CPU, then design checks and particle routing tables. Every frame: particles step on a WebGPU compute shader with positions copied back, or on the CPU, then an egui mesh is drawn to a WebGL canvas.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="760" height="400" fill="#fcfcfb"/>
<rect x="14" y="14" width="732" height="150" rx="8" fill="none" stroke="#e4e3df" stroke-width="1.5"/>
<text x="28.0" y="36.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WHEN THE NETWORK CHANGES</text>
<rect x="40" y="52" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="115.0" y="75.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Network</text>
<text x="115.0" y="92.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">nodes, pipes, fluid</text>
<rect x="240" y="52" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="315.0" y="75.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Global gradient solve</text>
<text x="315.0" y="92.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">CPU, f64</text>
<rect x="440" y="44" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="515.0" y="67.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Design checks</text>
<text x="515.0" y="84.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">velocity, NPSH, cavitation</text>
<rect x="440" y="106" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="515.0" y="129.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Particle topology</text>
<text x="515.0" y="146.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">routing tables</text>
<line x1="190" y1="79" x2="238" y2="79" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="390" y1="72" x2="438" y2="64" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="390" y1="88" x2="438" y2="130" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="14" y="184" width="732" height="202" rx="8" fill="none" stroke="#e4e3df" stroke-width="1.5"/>
<text x="732.0" y="206.0" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">EVERY FRAME, WHILE PARTICLES ARE SHOWING</text>
<rect x="40" y="226" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="115.0" y="249.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Compute shader step</text>
<text x="115.0" y="266.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WebGPU, if available</text>
<rect x="240" y="226" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="315.0" y="249.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Copy positions back</text>
<text x="315.0" y="266.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">one copy in flight</text>
<rect x="40" y="312" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="115.0" y="335.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">CPU step</text>
<text x="115.0" y="352.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">fallback, same algorithm</text>
<rect x="440" y="268" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="515.0" y="291.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Build egui mesh</text>
<text x="515.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">one quad per particle</text>
<rect x="620" y="268" width="112" height="54" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="676.0" y="291.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">WebGL canvas</text>
<text x="676.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">whole interface</text>
<line x1="190" y1="253" x2="238" y2="253" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="390" y1="253" x2="438" y2="282" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="190" y1="339" x2="438" y2="310" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="590" y1="295" x2="618" y2="295" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M515,160 V 174 H 115 V 224" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
